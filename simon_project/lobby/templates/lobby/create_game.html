{% extends "base.html" %}

{% block title %}Create a Game{% endblock %}

{% block main %}
<div class="create-box">
  <h1>Create a Game</h1>

  <form method="post">
    {% csrf_token %}
    <div class="form-check form-switch my-4">
      <input class="form-check-input" type="checkbox" role="switch" id="is_public" name="is_public">
      <label class="form-check-label" for="is_public">Public game (listed on the Join page)</label>
    </div>
    <p class="text-muted">Private games can only be joined with their code.</p>
    <button type="submit" class="btn btn-lg onglet green">Create</button>
  </form>
</div>
{% endblock %}
