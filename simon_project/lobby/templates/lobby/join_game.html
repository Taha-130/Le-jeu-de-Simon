  {% extends "base.html" %}

  {% block main %}
    <h1>Join a Game</h1>
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label for="code" class="form-label">Game Code</label>
        <input type="text" class="form-control" id="code" name="code" placeholder="Enter game code">
      </div>
      <button type="submit" class="btn btn-primary" >Join Game</button>
    </form>
  {% endblock %}
