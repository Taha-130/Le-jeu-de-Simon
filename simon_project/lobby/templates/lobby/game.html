{% extends "base.html" %}
{% load static %}

{% block title %}Game {{ game.code }}{% endblock %}

{% block main %}
<div id="loading" class="loading">
  <div class="spinner-border" role="status"></div>
  <h2 class="mt-4">The game will start...</h2>
</div>

<div class="game">
  <div class="d-flex justify-content-between align-items-start">
    <div id="players" class="players"></div>
    <div class="code-badge">Code <strong>{{ game.code }}</strong></div>
  </div>

  <p id="info" class="info text-center"></p>
  <p id="alert" class="alert text-center"></p>

  <div id="board" class="board inactive">
    <button class="simon red" data-color="red"></button>
    <button class="simon blue" data-color="blue"></button>
    <button class="simon yellow" data-color="yellow"></button>
    <button class="simon green" data-color="green"></button>
    <div class="center">SIMON</div>
  </div>

  <div class="text-center mt-3">
    <a id="home-link" href="/" class="btn onglet green d-none">Return to homepage</a>
    <form method="post" action="{% url 'lobby:leave' game.code %}" class="d-inline">
      {% csrf_token %}
      <button type="submit" class="btn btn-outline-danger">Leave the game</button>
    </form>
  </div>
</div>

<script>
  const code = "{{ game.code }}";
  const moi = "{{ user.username }}";
</script>
<script src="{% static 'js/game.js' %}"></script>
{% endblock %}
