{% extends "base.html" %}

{% block title %}Error 400{% endblock %}

{% block main %}
<div class="text-center error">
    <div class="error-code">
        <span class="tile red">4</span>
        <span class="tile blue">0</span>
        <span class="tile green">0</span>
    </div>

    <h1 class="mt-4">Invalid Request</h1>
    <p class="lead">The server did not understand the request sent.<br>Please check the URL or try again.</p>

    <a href="/" class="btn btn-lg onglet green mt-3">Return to Home</a>
</div>
{% endblock %}
