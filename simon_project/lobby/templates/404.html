{% extends "base.html" %}

{% block title %}Error 404{% endblock %}

{% block main %}

<div class="text-center error">
    <div class="error-code">
        <span class="tile red">4</span>
        <span class="tile blue">0</span>
        <span class="tile green">4</span>
    </div>
    <h1 class="mt-4">Page Not Found</h1>
    <p class="lead">This page does not exist or has been moved.</p>
    <a href="/" class="btn btn-lg onglet green mt-3">Return to Home</a>
</div>

{% endblock %}
