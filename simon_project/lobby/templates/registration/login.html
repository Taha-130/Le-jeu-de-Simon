{% extends "base.html" %}

{% block title %}Connexion{% endblock %}

{% block main %}
<div class="container mt-5" style="max-width: 400px;">
    <h1>Connexion</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="btn btn-primary">Se connecter</button>
    </form>
</div>
{% endblock %}
