{% extends "base.html" %}

{% block title %}Account required - Simon Online{% endblock %}

{% block main %}
  
  <h1>You need an account</h1>
  
  {% if error %}
    <div class="alert alert-danger" role="alert">
      {{ error }}
    </div>
  {% endif %}
  
  <p>You have to login or sign up to our website to access this feature.</p>

  <div class="d-flex gap-2 mt-4">
    <a href="{% url 'users:login' %}" class="btn btn-lg onglet yellow">Login</a>
    <a href="{% url 'users:signup' %}" class="btn btn-lg onglet blue">Sign Up</a>
  </div>

{% endblock %}
