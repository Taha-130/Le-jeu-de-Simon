{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Login - Simon Online{% endblock %}

{% block main %}

<h1>Login</h1>

{% if error %}
  <div class="alert alert-danger" role="alert">
    {{ error }}
  </div>
{% endif %}

<form action="{% url 'users:login' %}" method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <input type="submit" class="btn btn-primary" value="Submit">
</form>

{% endblock %}
